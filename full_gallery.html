<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Inspirations | HubHome</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --page: #f5f0ea;
      --text: #161616;
      --muted: #716d65;
      --fine: #d9b184;
      --cream: #f9f7f3;
      --line: rgba(38, 38, 38, 0.18);
      --shadow: rgba(0, 0, 0, 0.12);
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
    }

    .inspiration-page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 56px 42px 80px;
      background: var(--page);
    }

    .page-title {
      margin: 0 0 32px;
      font-size: clamp(4rem, 4vw, 3.8rem);
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr));
      gap: 16px;
      align-items: stretch;
      min-height: 440px;
      margin-top: 8px;
    }

    .tile {
      position: relative;
      overflow: hidden;
      background: #eae7df;
      border-radius: 4px;
      box-shadow: 0 2px 10px var(--shadow);
      min-height: 160px;
      height: 180px;
      transition: transform 300ms ease, box-shadow 300ms ease;
    }

    .tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px var(--shadow);
    }

    .tile img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .tile.tall {
      height: 310px;
      min-height: 310px;
    }

    .tile.mid {
      height: 240px;
      min-height: 240px;
    }

    .tile.wide {
      height: 210px;
      min-height: 210px;
    }

    .tile.tiny {
      height: 150px;
      min-height: 150px;
    }

    @media (max-width: 960px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(160px, 1fr));
      }
    }

    @media (max-width: 680px) {
      .inspiration-page {
        padding: 24px 16px 40px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
